<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Eligibility Predictor – Landing Page</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(to bottom right, #eef2ff, #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.9s ease-in-out;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #1e40af;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            margin: 12px 0;
            padding: 14px;
            text-decoration: none;
            background: #3b82f6;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Loan Eligibility Predictor</h1>
        <p>FastAPI + Streamlit • Machine Learning • Cloud Deployment</p>

        <a class="btn" href="https://loan-ui.onrender.com" target="_blank">🚀 Open Streamlit App</a>

        <a class="btn" href="https://loan-api-z9u8.onrender.com/docs" target="_blank">🧪 Open API (Swagger Docs)</a>

        <a class="btn" href="https://github.com/sobiya57/loan-eligibility" target="_blank">📂 View GitHub Repository</a>

        <div class="footer">Made by Sobiya Begum ✨</div>
    </div>
</body>
</html>
